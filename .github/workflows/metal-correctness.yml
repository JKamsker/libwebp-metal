name: Metal correctness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/metal-correctness.yml"
      - "CMakeLists.txt"
      - "cmake/**"
      - "examples/**"
      - "imageio/**"
      - "scripts/test_metal.sh"
      - "sharpyuv/**"
      - "src/**"
      - "tests/metal_adversarial_test.c"
      - "tests/metal_api_fuzzer.c"
  schedule:
    # Weekly Monday replay of the current default-branch revision (UTC).
    - cron: "27 4 * * 1"

permissions:
  contents: read

concurrency:
  group: metal-correctness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-metal:
    name: Physical Metal correctness (self-hosted ARM64)
    # Trust boundary: automatic runs are restricted to main pushes/current main
    # schedules. A manual dispatch is an operator assertion that its selected
    # revision was reviewed. PR and PR-target events are neither subscribed to
    # above nor admitted by this defense-in-depth event/ref guard.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'schedule' && github.ref == 'refs/heads/main')
    runs-on: [self-hosted, macOS, ARM64, metal]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record runner environment
        run: |
          mkdir -p artifacts
          sw_vers > artifacts/sw_vers.txt
          uname -a > artifacts/uname.txt
          system_profiler SPHardwareDataType SPDisplaysDataType | \
            sed -E '/(Serial Number|Hardware UUID|Provisioning UDID)/d' \
            > artifacts/system_profiler.txt
          xcodebuild -version > artifacts/xcode.txt 2>&1 || true
          pmset -g batt > artifacts/power.txt 2>&1 || true
          pmset -g therm > artifacts/thermal.txt 2>&1 || true
      - name: Require physical ARM64 Metal device
        run: |
          test "$RUNNER_ARCH" = ARM64
          test "$(uname -m)" = arm64
          xcrun swift -e '
            import Metal
            guard let device = MTLCreateSystemDefaultDevice() else {
              fatalError("no Metal device")
            }
            print("name=\(device.name)")
            print("registryID=\(device.registryID)")
          ' > artifacts/metal-device.txt
          cat artifacts/metal-device.txt
      - name: Configure Metal build
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DWEBP_ENABLE_METAL=ON
          -DWEBP_BUILD_ANIM_UTILS=OFF
          -DWEBP_BUILD_EXTRAS=OFF
          -DWEBP_BUILD_GIF2WEBP=OFF
          -DWEBP_BUILD_IMG2WEBP=OFF
          -DWEBP_BUILD_VWEBP=OFF
          -DWEBP_BUILD_WEBPMUX=OFF
      - name: Build encoder and decoder
        run: cmake --build build --target cwebp dwebp --parallel 2
      - name: Forced Metal correctness
        env:
          WEBP_TEST_BIN_DIR: ${{ github.workspace }}/build
          WEBP_TEST_REQUIRE_METAL: "1"
          WEBP_TEST_METAL_LOG: >-
            ${{ github.workspace }}/artifacts/forced-metal-dispatch.log
          WEBP_ACCELERATOR: metal
          WEBP_METAL: "1"
        run: |
          status=0
          scripts/test_metal.sh \
            > artifacts/forced-metal.stdout \
            2> artifacts/forced-metal.stderr || status=$?
          cat artifacts/forced-metal.stdout
          cat artifacts/forced-metal-dispatch.log >&2
          cat artifacts/forced-metal.stderr >&2
          exit "$status"
      - name: Public API adversarial coverage
        env:
          WEBP_ACCELERATOR: metal
        run: |
          cc -std=c99 -Wall -Wextra -Werror \
            -I"${{ github.workspace }}" \
            -I"${{ github.workspace }}/src" \
            tests/metal_adversarial_test.c \
            build/libwebp.a build/libsharpyuv.a \
            -framework Foundation -framework Metal -lc++ -lm \
            -o build/metal_adversarial_test
          for mode in matrix transform output-strides cancellation; do
            build/metal_adversarial_test "$mode" \
              2> "artifacts/adversarial-$mode.log"
          done
          grep -q "WebP-Metal: hash candidates" \
            artifacts/adversarial-matrix.log
          grep -q "WebP-Metal: transformed" \
            artifacts/adversarial-transform.log
          grep -q "WebP-Metal: lossy RGB->YUV" \
            artifacts/adversarial-output-strides.log
          grep -q "WebP-Metal: transformed" \
            artifacts/adversarial-cancellation.log
      - name: Configure sanitizer build
        run: >-
          cmake -S . -B build-sanitized -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DWEBP_ENABLE_METAL=ON
          -DWEBP_BUILD_ANIM_UTILS=OFF
          -DWEBP_BUILD_CWEBP=OFF
          -DWEBP_BUILD_DWEBP=OFF
          -DWEBP_BUILD_EXTRAS=OFF
          -DWEBP_BUILD_GIF2WEBP=OFF
          -DWEBP_BUILD_IMG2WEBP=OFF
          -DWEBP_BUILD_VWEBP=OFF
          -DWEBP_BUILD_WEBPINFO=OFF
          -DWEBP_BUILD_WEBPMUX=OFF
          -DCMAKE_C_FLAGS="-fsanitize=undefined -fno-omit-frame-pointer"
          -DCMAKE_OBJCXX_FLAGS="-fsanitize=undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=undefined"
      - name: Forced Metal sanitizer fuzz replay
        env:
          WEBP_ACCELERATOR: metal
          WEBP_METAL: "1"
          WEBP_METAL_MIN_PIXELS: "0"
          WEBP_METAL_HASH: "1"
          WEBP_METAL_HASH_MIN_PIXELS: "0"
          WEBP_METAL_LOSSY: "1"
          WEBP_METAL_LOSSY_MIN_PIXELS: "0"
          WEBP_METAL_VERBOSE: "1"
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cmake --build build-sanitized --target webp --parallel 2
          clang -std=c99 -Wall -Wextra -Werror \
            -DWEBP_FUZZ_STANDALONE \
            -fsanitize=undefined -fno-omit-frame-pointer \
            -I"${{ github.workspace }}/src" \
            tests/metal_api_fuzzer.c \
            build-sanitized/libwebp.a build-sanitized/libsharpyuv.a \
            -framework Foundation -framework Metal -lc++ -lm \
            -o build-sanitized/metal_api_fuzzer_replay
          build-sanitized/metal_api_fuzzer_replay \
            2> artifacts/ubsan-metal.log
          grep -q "WebP-Metal: transformed" artifacts/ubsan-metal.log
          grep -q "WebP-Metal: hash candidates" artifacts/ubsan-metal.log
          grep -q "WebP-Metal: lossy RGB->YUV" artifacts/ubsan-metal.log
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metal-correctness-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
