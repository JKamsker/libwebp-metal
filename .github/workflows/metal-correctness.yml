name: Metal correctness

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches: [main]
    paths:
      - ".github/workflows/metal-correctness.yml"
      - "CMakeLists.txt"
      - "configure.ac"
      - "makefile.unix"
      - "scripts/test_metal.sh"
      - "tests/metal_adversarial_test.c"
      - "tests/metal_api_fuzzer.c"
      - "src/dsp/**"
      - "src/enc/**"

permissions:
  contents: read

concurrency:
  group: metal-correctness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-metal:
    # These labels intentionally select a project-owned physical Mac. Do not
    # replace them with a generic hosted macOS image and call it GPU coverage.
    runs-on: [self-hosted, macOS, ARM64, metal]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Record runner environment
        run: |
          mkdir -p artifacts
          sw_vers > artifacts/sw_vers.txt
          uname -a > artifacts/uname.txt
          system_profiler SPHardwareDataType SPDisplaysDataType | \
            sed -E '/(Serial Number|Hardware UUID|Provisioning UDID)/d' \
            > artifacts/system_profiler.txt
          xcodebuild -version > artifacts/xcode.txt 2>&1 || true
          pmset -g batt > artifacts/power.txt 2>&1 || true
          pmset -g therm > artifacts/thermal.txt 2>&1 || true
      - name: Configure Metal build
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DWEBP_ENABLE_METAL=ON
          -DWEBP_BUILD_ANIM_UTILS=OFF
          -DWEBP_BUILD_EXTRAS=OFF
          -DWEBP_BUILD_GIF2WEBP=OFF
          -DWEBP_BUILD_IMG2WEBP=OFF
          -DWEBP_BUILD_VWEBP=OFF
          -DWEBP_BUILD_WEBPMUX=OFF
      - name: Build encoder and decoder
        run: cmake --build build --target cwebp dwebp --parallel 2
      - name: Forced Metal correctness
        env:
          WEBP_TEST_BIN_DIR: ${{ github.workspace }}/build
          WEBP_TEST_REQUIRE_METAL: "1"
        run: scripts/test_metal.sh
      - name: Public API adversarial coverage
        run: |
          cc -std=c99 -Wall -Wextra -Werror \
            -I"${{ github.workspace }}/src" \
            tests/metal_adversarial_test.c \
            build/libwebp.a build/libsharpyuv.a \
            -framework Foundation -framework Metal -lc++ -lm \
            -o build/metal_adversarial_test
          : > artifacts/adversarial-metal.log
          for mode in matrix transform cancellation; do
            build/metal_adversarial_test "$mode" \
              2>> artifacts/adversarial-metal.log
          done
          grep -q "WebP-Metal: transformed" artifacts/adversarial-metal.log
          grep -q "WebP-Metal: hash candidates" artifacts/adversarial-metal.log
          grep -q "WebP-Metal: lossy RGB->YUV" artifacts/adversarial-metal.log
      - name: Configure sanitizer build
        run: >-
          cmake -S . -B build-sanitized -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DWEBP_ENABLE_METAL=ON
          -DWEBP_BUILD_ANIM_UTILS=OFF
          -DWEBP_BUILD_CWEBP=OFF
          -DWEBP_BUILD_DWEBP=OFF
          -DWEBP_BUILD_EXTRAS=OFF
          -DWEBP_BUILD_GIF2WEBP=OFF
          -DWEBP_BUILD_IMG2WEBP=OFF
          -DWEBP_BUILD_VWEBP=OFF
          -DWEBP_BUILD_WEBPINFO=OFF
          -DWEBP_BUILD_WEBPMUX=OFF
          -DCMAKE_C_FLAGS="-fsanitize=undefined -fno-omit-frame-pointer"
          -DCMAKE_OBJCXX_FLAGS="-fsanitize=undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=undefined"
      - name: Forced Metal sanitizer fuzz replay
        env:
          WEBP_ACCELERATOR: metal
          WEBP_METAL: "1"
          WEBP_METAL_MIN_PIXELS: "0"
          WEBP_METAL_HASH: "1"
          WEBP_METAL_HASH_MIN_PIXELS: "0"
          WEBP_METAL_LOSSY: "1"
          WEBP_METAL_LOSSY_MIN_PIXELS: "0"
        run: |
          cmake --build build-sanitized --target webp --parallel 2
          clang -std=c99 -Wall -Wextra -Werror \
            -DWEBP_FUZZ_STANDALONE \
            -fsanitize=undefined -fno-omit-frame-pointer \
            -I"${{ github.workspace }}/src" \
            tests/metal_api_fuzzer.c \
            build-sanitized/libwebp.a build-sanitized/libsharpyuv.a \
            -framework Foundation -framework Metal -lc++ -lm \
            -o build-sanitized/metal_api_fuzzer_replay
          build-sanitized/metal_api_fuzzer_replay
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metal-correctness-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
